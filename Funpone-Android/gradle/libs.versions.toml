[versions]
kotlin = "2.4.10"
robolectric = "4.16.1"
screenshot = "0.0.1-alpha16"

[plugins]
android-application = { id = "com.android.application", version = "9.3.1" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }

[libraries]
activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.0" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.08.00" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version = "1.7.8" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.2.1" }
junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version = "1.3.0" }
turbine = { group = "app.cash.turbine", name = "turbine", version = "1.2.1" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }
